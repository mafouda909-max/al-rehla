<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="تفاصيل عرض في الرحلة تعرض السعر المبدئي وما يشمله العرض والوكيل المسؤول وصلاحية السعر.">
  <title>تفاصيل العرض | الرحلة</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="offer-details">
  <header class="topbar" data-site-header></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <div class="inline-banner hidden" data-fallback-banner></div>
      </div>
    </section>

    <section class="section">
      <div class="container split-layout">
        <div>
          <article class="form-card" data-offer-hero></article>
          <div class="detail-grid" style="margin-top:18px" data-offer-details></div>
        </div>
        <aside class="profile-side" data-offer-side></aside>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head">
          <div>
            <h2 class="section-title">عروض مشابهة</h2>
            <p class="section-sub">وجود بدائل على نفس الصفحة يساعد في العرض الأول ويوضح فكرة المقارنة داخل المنصة.</p>
          </div>
        </div>
        <div class="cards-grid" data-related-offers></div>
      </div>
    </section>
  </main>

  <footer class="footer" data-site-footer></footer>

  <script src="data/offers.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
