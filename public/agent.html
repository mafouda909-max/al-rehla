<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ملف وكيل في الرحلة يعرض التقييم والشارات والعروض النشطة وطرق التواصل بشكل عربي واضح.">
  <title>ملف الوكيل | الرحلة</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="agent">
  <header class="topbar" data-site-header></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <div class="profile-layout">
          <article class="profile-hero form-card" data-agent-header></article>
          <aside class="profile-side">
            <div class="dashboard" data-agent-stats></div>
            <div data-agent-contact></div>
          </aside>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container profile-layout">
        <div>
          <div class="section-head">
            <div>
              <h2 class="section-title">العروض النشطة</h2>
              <p class="section-sub">العروض المرتبطة بهذا الوكيل تظهر مباشرة لتدعم الثقة وتساعد العميل على اتخاذ قرار أسرع.</p>
            </div>
          </div>
          <div class="cards-grid" data-agent-offers></div>
        </div>

        <aside class="profile-side" data-agent-trust></aside>
      </div>
    </section>
  </main>

  <footer class="footer" data-site-footer></footer>

  <script src="data/offers.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
